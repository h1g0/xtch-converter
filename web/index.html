<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XTCH Converter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='3' fill='%23333'/%3E%3Crect x='10' y='6' width='12' height='18' fill='%23eee'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <h1>XTCH Converter</h1>
      <p class="sub">PDF・画像ZIPを Xteink X4 / X3 用の <code>.xtch</code> / <code>.xtc</code> に変換します。処理はすべてブラウザ内で行われ、ファイルはどこにも送信されません。</p>
    </header>

    <main class="layout">
      <section class="panel settings" aria-label="変換設定">
        <h2>設定</h2>
        <form id="settings">
          <fieldset>
            <legend>端末</legend>
            <div class="seg">
              <label><input type="radio" name="device" value="x4" checked /><span>X4<small>480×800</small></span></label>
              <label><input type="radio" name="device" value="x3" /><span>X3<small>528×792</small></span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>出力形式</legend>
            <div class="seg">
              <label><input type="radio" name="bits" value="2" checked /><span>XTCH<small>4階調</small></span></label>
              <label><input type="radio" name="bits" value="1" /><span>XTC<small>白黒2値</small></span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>レイアウト</legend>
            <select name="mode">
              <option value="auto">自動（画面より大きい画像は分割）</option>
              <option value="split">常に分割</option>
              <option value="fit">分割せず1画面に収める</option>
            </select>
            <p class="hint">分割時は画像の短辺を画面の長辺に合わせて拡縮し、画面サイズごとに切り出します。PDFは「自動」で分割扱いです。</p>
          </fieldset>

          <fieldset class="split-only">
            <legend>縦長画像の回転方向</legend>
            <div class="seg">
              <label><input type="radio" name="rotate" value="cw" checked /><span>時計回り</span></label>
              <label><input type="radio" name="rotate" value="ccw" /><span>反時計回り</span></label>
            </div>
          </fieldset>

          <fieldset class="split-only">
            <legend>横長画像の分割順</legend>
            <div class="seg">
              <label><input type="radio" name="stripOrder" value="ltr" checked /><span>左 → 右</span></label>
              <label><input type="radio" name="stripOrder" value="rtl" /><span>右 → 左<small>漫画</small></span></label>
            </div>
          </fieldset>

          <fieldset class="split-only">
            <legend>最小のりしろ <output name="minOverlapOut"></output></legend>
            <input type="range" name="minOverlap" min="0" max="160" step="4" value="0" />
          </fieldset>

          <fieldset>
            <legend>画質</legend>
            <label class="row"><input type="checkbox" name="trim" /> 余白を自動カット</label>
            <label class="row">ディザリング
              <select name="dither">
                <option value="floyd-steinberg">Floyd–Steinberg</option>
                <option value="atkinson">Atkinson</option>
                <option value="ordered">パターン (Bayer)</option>
                <option value="none">なし（単純量子化）</option>
              </select>
            </label>
            <label class="slider">ガンマ <output name="gammaOut"></output>
              <input type="range" name="gamma" min="0.5" max="2.5" step="0.05" value="1" />
            </label>
            <label class="slider">黒レベル <output name="blackOut"></output>
              <input type="range" name="black" min="0" max="128" step="1" value="0" />
            </label>
            <label class="slider">白レベル <output name="whiteOut"></output>
              <input type="range" name="white" min="128" max="255" step="1" value="255" />
            </label>
            <button type="button" id="reset" class="link">画質設定をリセット</button>
          </fieldset>
        </form>
      </section>

      <section class="work">
        <label id="drop" class="drop" tabindex="0">
          <input id="file" type="file" multiple accept=".pdf,.zip,.cbz,image/*" hidden />
          <strong>PDF / ZIP (CBZ) / 画像ファイル</strong>
          <span>ここにドロップ、またはクリックして選択</span>
          <small>複数の画像ファイルは名前順に1冊にまとめます</small>
        </label>

        <div class="actions">
          <button id="convert" class="primary" disabled>変換</button>
          <button id="cancel" hidden>中止</button>
          <button id="clear" class="ghost" disabled>リストを空にする</button>
          <span id="status" class="status" role="status"></span>
        </div>

        <ul id="jobs" class="jobs"></ul>

        <section id="preview" class="panel preview" hidden>
          <div class="preview-head">
            <h2 id="previewTitle">プレビュー</h2>
            <span id="previewInfo" class="muted"></span>
          </div>
          <div id="thumbs" class="thumbs"></div>
        </section>
      </section>
    </main>

    <dialog id="viewer">
      <div class="viewer-bar">
        <button id="prev" aria-label="前のページ">‹</button>
        <span id="viewerInfo"></span>
        <button id="next" aria-label="次のページ">›</button>
        <button id="close" aria-label="閉じる">×</button>
      </div>
      <canvas id="big"></canvas>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
