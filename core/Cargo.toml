[package]
name = "xtch-core"
version = "0.1.0"
edition = "2021"
description = "Image processing and XTC/XTCH encoding for Xteink e-paper readers"
repository = "https://github.com/h1g0/xtch-converter"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
